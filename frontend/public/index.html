<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta
      name="description"
      content="Social Media Video Downloader - Download videos from YouTube, Instagram, Facebook, Twitter, TikTok"
    />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" type="image/png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/logo.png" type="image/png" />
    <title>SPVB - Social Media Video Downloader</title>
    <!-- Mobile Ad Protection: Prevent unwanted redirects -->
    <script>
      (function() {
        const isMobile = /iPhone|iPad|Android|webOS|BlackBerry/i.test(navigator.userAgent);
        if (!isMobile) return;

        // Block all window.open calls that try to navigate away from app
        const originalOpen = window.open;
        window.open = function(url, target, features) {
          if (url && typeof url === 'string') {
            const urlObj = new URL(url, window.location.href);
            // Allow internal app links only
            if (urlObj.hostname !== window.location.hostname) {
              console.warn('[SPVB] Blocked external redirect:', url);
              return null;
            }
          }
          return originalOpen.call(window, url, target, features);
        };

        // Prevent window.location changes on mobile
        const blockNavigation = (url) => {
          if (!url || typeof url !== 'string') return false;
          try {
            const urlObj = new URL(url, window.location.href);
            // Block external navigation
            return urlObj.hostname !== window.location.hostname;
          } catch {
            return false;
          }
        };

        const originalAssign = window.location.assign;
        window.location.assign = function(url) {
          if (blockNavigation(url)) {
            console.warn('[SPVB] Blocked navigation:', url);
            return;
          }
          return originalAssign.call(window.location, url);
        };

        const originalReplace = window.location.replace;
        window.location.replace = function(url) {
          if (blockNavigation(url)) {
            console.warn('[SPVB] Blocked navigation:', url);
            return;
          }
          return originalReplace.call(window.location, url);
        };
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
