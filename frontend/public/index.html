        min-height: 100vh;
        overflow-x: hidden;
      }

      #root {

      }

      /* LEFT SIDEBAR */
      #ads-left {
        position: fixed;
        left: 0;
        top: 0;
        width: 310px;
        height: 100vh;
        background: #0B1220;
        border-right: 1px solid #1e3a5f;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px;
        z-index: 97;
      }

      /* RIGHT SIDEBAR */
      #ads-right {
        position: fixed;
        right: 0;
        top: 0;
        width: 310px;
        height: 100vh;
        background: #0B1220;
        border-left: 1px solid #1e3a5f;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px;
        z-index: 97;
      }

      /* MAIN CONTENT */
      #root {
        margin-left: 330px;
        margin-right: 330px;
        padding: 20px;
      }

      /* AD SLOT STYLING */
      .ad-slot {
        margin: 10px 0;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      /* SCROLLBAR */
      #ads-left::-webkit-scrollbar,
      #ads-right::-webkit-scrollbar {
        width: 6px;
      }

      #ads-left::-webkit-scrollbar-track,
      #ads-right::-webkit-scrollbar-track {
        background: transparent;
      }

      #ads-left::-webkit-scrollbar-thumb,
      #ads-right::-webkit-scrollbar-thumb {
        background: #2563EB;
        border-radius: 3px;
      }

      @media (max-width: 1400px) {
        #ads-left {
          width: 100% !important;
          position: static !important;
          height: auto !important;
          border-right: none;
          border-bottom: 1px solid #1e3a5f;
          padding: 15px 10px !important;
          z-index: 1;
          display: block !important;
          left: auto !important;
          top: auto !important;
          overflow: visible !important;
        }
        #ads-right {
          width: 100% !important;
          position: static !important;
          height: auto !important;
          border-left: none;
          border-top: 1px solid #1e3a5f;
          padding: 15px 10px !important;
          z-index: 1;
          display: block !important;
          right: auto !important;
          top: auto !important;
          overflow: visible !important;
        }
        .ad-slot {
          width: 100%;
          max-width: 100%;
        }
        #root {
          margin-left: 0 !important;
          margin-right: 0 !important;
