services:
  - type: web
    name: spvb-downloader
    runtime: python
    runtimeVersion: 3.12.0
    buildCommand: pip install -r backend_python/requirements.txt
    startCommand: cd backend_python && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: info
      - key: DOWNLOAD_TIMEOUT
        value: "900000"
      - key: DOWNLOAD_QUALITY
        value: best
      - key: VIDEO_FORMAT
        value: mp4
