services:
  - type: web
    name: spvb-downloader
    runtime: python
    runtimeVersion: 3.12.0
    preBuildCommand: |
      apt-get update && apt-get install -y ffmpeg
    buildCommand: |
      pip install -r backend_python/requirements.txt
    startCommand: uvicorn backend_python.main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: spvb-games
    runtime: node
    plan: free
    buildCommand: |
      npm install
      (cd frontend && npm install && npm run build)
    startCommand: node server.js
    envVars:
      # Game URL is read at BUILD TIME into the frontend bundle.
      # Set this (e.g. https://selenite.cc/resources/semag/gtavc/index.html);
      # leave empty for the game page to show "Coming Soon".
      - key: REACT_APP_GAME_URL
        sync: false
      - key: NODE_VERSION
        value: 20.x
