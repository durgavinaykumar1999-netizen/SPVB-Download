services:
  - type: web
    name: spvb-downloader
    runtime: node
    region: oregon
    plan: free
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: spvb-downloader
          property: connectionString
    autoDeploy: true
    healthCheckPath: /health
