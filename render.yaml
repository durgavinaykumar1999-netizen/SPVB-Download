services:
  - type: web
    name: spvb-downloader
    runtime: python-3
    region: oregon
    plan: free
    startCommand: cd backend_python && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    buildCommand: pip install -r backend_python/requirements.txt && cd frontend && npm install && npm run build
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: spvb-downloader
          property: connectionString
    autoDeploy: true
    healthCheckPath: /api/health
